<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador | Damaso de Todo Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --fondo: #f5f6fa;
    --blanco: #ffffff;
    --negro: #171717;
    --dorado: #d6b15e;
    --dorado-claro: #f8f0dc;
    --borde: #e5e7eb;
    --texto-secundario: #6b7280;
    --verde: #16a34a;
    --rojo: #dc2626;
    --azul: #2563eb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--fondo);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--negro);
    line-height: 1.5;
}

header {
    background: #111111;
    color: white;
    padding: 22px 25px;
    border-bottom: 4px solid var(--dorado);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header span {
    color: var(--dorado);
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px;
}

.panel {
    background: var(--blanco);
    padding: 25px;
    margin-bottom: 24px;
    border-radius: 14px;
    border: 1px solid var(--borde);
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
}

.panel h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 21px;
    border-bottom: 1px solid var(--borde);
    padding-bottom: 12px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px 14px;
    margin: 7px 0 16px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    font-family: inherit;
    font-size: 15px;
    color: var(--negro);
    transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: var(--dorado);
    box-shadow: 0 0 0 3px rgba(214,177,94,0.18);
}

textarea {
    resize: vertical;
    min-height: 100px;
}

button {
    padding: 12px 18px;
    background: var(--dorado);
    color: #111111;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
}

button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(0);
}

.dark {
    background: #111111;
    color: white;
}

.item {
    padding: 16px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    margin: 12px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: #ffffff;
}

.item strong {
    font-size: 16px;
}

.item button {
    margin: 3px;
}

.note {
    color: var(--texto-secundario);
    font-size: 14px;
}

#orders .panel {
    border-left: 5px solid var(--dorado);
    background: #ffffff;
}

#orders .panel h3 {
    margin-top: 0;
    font-size: 18px;
}

#orders select {
    max-width: 300px;
}

#orders button {
    margin-top: 5px;
}

img {
    max-width: 100%;
    border-radius: 8px;
}

@media (max-width: 600px) {
    header {
        padding: 18px;
    }

    header h1 {
        font-size: 21px;
    }

    main {
        margin: 18px auto;
        padding: 0 12px;
    }

    .panel {
        padding: 18px;
        border-radius: 11px;
    }

    .item {
        align-items: flex-start;
    }

    button {
        padding: 11px 14px;
    }
}
</style>
</head>
<body>

<header>
<b>DAMASO <span>DE TODO STORE</span> · ADMINISTRADOR</b>
</header>

<main>

<section class="panel" id="loginPanel">
<h2>Iniciar sesión</h2>
<label>Correo electrónico</label>
<input type="email" id="email" placeholder="Tu correo">
<label>Contraseña</label>
<input type="password" id="password" placeholder="Tu contraseña">
<button onclick="login()">Entrar</button>
<p id="loginMessage" class="note"></p>
</section>

<section class="panel" id="adminPanel" style="display:none">
<h2>Panel de administración</h2>
<p>Bienvenido. Puedes administrar los productos de tu tienda.</p>
<button class="dark" onclick="logout()">Cerrar sesión</button>
</section>

<section class="panel" id="formPanel" style="display:none">
<h2 id="formTitle">Agregar producto</h2>

<input type="hidden" id="productId">

<label>Nombre del producto</label>
<input id="name" placeholder="Nombre del producto">

<label>Categoría</label><input id="image" type="file" accept="image/*">
<small>Selecciona una fotografía desde tu dispositivo.</small>
<select id="category">
<option>Ropa</option>
<option>Perfumes</option>
<option>Accesorios</option>
<option>Otros</option>
</select>

<label>Precio en RD$</label>
<input id="price" type="number" min="0">

<label>URL de imagen</label>


<label>Descripción</label>
<textarea id="description"></textarea>

<label>Existencia</label>
<input id="stock" type="number" min="0" value="1">

<button onclick="saveProduct()">Guardar producto</button>
<button class="dark" onclick="resetForm()">Cancelar</button>
<p id="message" class="note"></p>
</section>

<section class="panel" id="productsPanel" style="display:none">
<h2>Productos publicados</h2>
<div id="productsList">Cargando...</div>
</section>
<section class="panel" id="ordersPanel" style="display:none">
    <h2>Pedidos recibidos</h2>

    <button class="dark" onclick="loadOrders()">
        Actualizar pedidos
    </button>

    <div id="ordersList">
        Cargando pedidos...
    </div>
</section>
</main>

<script>const SUPABASE_URL = "https://nxaitlmgszqokjqccccz.supabase.co";
const SUPABASE_KEY="sb_publishable_igQfW_x-Dz1QdMxxVYicTQ_wgznRMre";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMessage");

 msg.textContent="Verificando acceso...";

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){
  msg.textContent="Error: "+error.message;
  return;
 }

 await checkAdmin();
}

async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();

 if(!user){
  showLogin();
  return;
 }

 const {data,error}=await db
  .from("store_admins")
  .select("user_id")
  .eq("user_id",user.id)
  .maybeSingle();

 if(error || !data){
  await db.auth.signOut();
  document.getElementById("loginMessage").textContent=
  "Este usuario no tiene autorización de administrador.";
  showLogin();
  return;
 }

 document.getElementById("loginPanel").style.display="none";
 document.getElementById("adminPanel").style.display="block";
 document.getElementById("formPanel").style.display="block";
 document.getElementById("productsPanel").style.display="block";
document.getElementById("ordersPanel").style.display="block";

loadProducts();
loadOrders();
}

function showLogin(){
 document.getElementById("loginPanel").style.display="block";
 document.getElementById("adminPanel").style.display="none";
 document.getElementById("formPanel").style.display="none";
 document.getElementById("productsPanel").style.display="none";
}

async function logout(){
 await db.auth.signOut();
 showLogin();
}

async function loadProducts(){
 const list=document.getElementById("productsList");
 list.textContent="Cargando productos...";

 const {data,error}=await db
  .from("products")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  list.textContent="Error al cargar: "+error.message;
  return;
 }

 if(!data.length){
  list.textContent="Todavía no hay productos.";
  return;
 }

 list.innerHTML=data.map(p=>`
 <div class="item">
 <div>
 <b>${escapeHTML(p.name)}</b><br>
 <small>${escapeHTML(p.category||"Otros")} · RD$${Number(p.price).toLocaleString("es-DO")}</small>
 <br><small>Existencia: ${p.stock||0}</small>
 </div>
 <div>
 <button onclick="editProduct('${p.id}')">Editar</button>
 <button class="dark" onclick="deleteProduct('${p.id}')">Eliminar</button>
 </div>
 </div>
 `).join("");
}

function escapeHTML(value){
 return String(value||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

async function saveProduct(){
 const id=document.getElementById("productId").value;
 const name=document.getElementById("name").value.trim();
 const category=document.getElementById("category").value;
 const price=Number(document.getElementById("price").value);
 const imageFile = document.getElementById("image").files[0];
const description = document.getElementById("description").value.trim();
const stock = Number(document.getElementById("stock").value);

const msg = document.getElementById("message");

if (!name || !price || price < 0) {
  msg.textContent = "Completa el nombre y un precio válido.";
  return;
}

if (imageFile) {
  if (!imageFile.type.startsWith("image/")) {
    msg.textContent = "Selecciona un archivo de imagen válido.";
    return;
  }

  const fileName = `${crypto.randomUUID()}-${imageFile.name}`;

  const { data: uploadData, error: uploadError } = await db.storage
    .from("product-images")
    .upload(fileName, imageFile);

  if (uploadError) {
    msg.textContent = "Error al subir la fotografía: " + uploadError.message;
    return;
  }

  const { data: urlData } = db.storage
    .from("product-images")
    .getPublicUrl(uploadData.path);

  image_url = urlData.publicUrl;
} else if (id) {
  const { data: oldProduct, error: oldError } = await db
    .from("products")
    .select("image_url")
    .eq("id", id)
    .single();

  if (oldError) {
    msg.textContent = "Error al recuperar la fotografía: " + oldError.message;
    return;
  }

  image_url = oldProduct.image_url || "";
} else {
  msg.textContent = "Selecciona una fotografía del producto.";
  return;
}
const product = {
  name,
  category,
  price,
  image_url,
  description,
  stock,
  active: true
};

 msg.textContent="Guardando producto...";

 let result;

 if(id){
  result=await db.from("products").update(product).eq("id",id);
 }else{
  result=await db.from("products").insert(product);
 }

 if(result.error){
  msg.textContent="Error: "+result.error.message;
  return;
 }

 msg.textContent="Producto guardado correctamente.";
 resetForm();
 loadProducts();
}

async function editProduct(id){
 const {data,error}=await db
  .from("products")
  .select("*")
  .eq("id",id)
  .single();

 if(error){
  alert(error.message);
  return;
 }

 document.getElementById("productId").value=data.id;
 document.getElementById("name").value=data.name;
 document.getElementById("category").value=data.category;
 document.getElementById("price").value=data.price;
 
 document.getElementById("description").value=data.description||"";
 document.getElementById("stock").value=data.stock||0;
 document.getElementById("formTitle").textContent="Editar producto";

 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
 if(!confirm("¿Seguro que deseas eliminar este producto?"))return;

 const {error}=await db.from("products").delete().eq("id",id);

 if(error){
  alert("Error: "+error.message);
  return;
 }

 loadProducts();
}

function resetForm(){
 document.getElementById("productId").value="";
 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("image").value="";
 document.getElementById("description").value="";
 document.getElementById("stock").value="1";
 document.getElementById("formTitle").textContent="Agregar producto";
 document.getElementById("message").textContent="";
}
async function loadOrders() {
    const ordersList = document.getElementById("ordersList");

    ordersList.innerHTML = "Consultando pedidos...";

    const { data, error } = await db
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        ordersList.innerHTML =
            "Error al cargar pedidos: " + error.message;
        console.error("Error de pedidos:", error);
        return;
    }

    if (!data || data.length === 0) {
        ordersList.innerHTML = "Todavía no hay pedidos registrados.";
        return;
    }

    ordersList.innerHTML = data.map(p => `
        <div class="panel">
            <h3>Pedido #${p.id}</h3>
            <p><strong>Cliente:</strong> ${p.customer_name || "No indicado"}</p>
            <p><strong>Teléfono:</strong> ${p.customer_phone || "No indicado"}</p>
            <p><strong>Dirección:</strong> ${p.delivery_address || "No indicada"}</p>
            <p><strong>Productos:</strong> ${JSON.stringify(p.items || [])}</p>
            <p><strong>Total:</strong> RD$ ${p.total || 0}</p>
            <p><strong>Fecha:</strong> ${p.created_at || "No indicada"}</p>

            <label>Estado del pedido:</label>
            <select id="status-${p.id}">
                <option value="Pendiente">Pendiente</option>
                <option value="Confirmado">Confirmado</option>
                <option value="Enviado">Enviado</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
            </select>

            <button onclick="updateOrderStatus('${p.id}')">
                Guardar estado
            </button>
        </div>
    `).join("");

    data.forEach(p => {
        const select = document.getElementById("status-" + p.id);
        if (select) {
            select.value = p.status || "Pendiente";
        }
    });
}    
async function updateOrderStatus(id) {
    const select = document.getElementById("status-" + id);
    const status = select.value;

    if (status === "Confirmado") {
        const { data, error } = await db.rpc(
            "confirm_order_deduct_stock",
            { p_order_id: id }
        );

        if (error) {
            alert("No se pudo confirmar el pedido: " + error.message);
            loadOrders();
            return;
        }

        if (data && data.already_deducted) {
            alert("Este pedido ya tenía el inventario descontado.");
        } else {
            alert("Pedido confirmado e inventario descontado correctamente.");
        }

        loadOrders();
        return;
    }

    const { error } = await db
        .from("orders")
        .update({ status: status })
        .eq("id", id);

    if (error) {
        alert("No se pudo actualizar el pedido: " + error.message);
        loadOrders();
        return;
    }

    alert("Estado del pedido actualizado correctamente.");
    loadOrders();
}

db.auth.getSession().then(({ data }) => {
    if (data.session) {
        checkAdmin();
    }
});
</script>

</body>
</html>
